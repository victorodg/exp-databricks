resources:
  jobs:
    dexp_daily_experiencia:
      name: dexp_daily_experiencia
      description: Daily Experiência BR (MKT + Dynamics e Resenhas). Lê o volume dexp_landing e gera as camadas bronze, silver e gold.
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
        - task_key: bronze
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ../src/bronze/carregar_bronze.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: silver
          depends_on:
            - task_key: bronze
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ../src/silver/carregar_silver.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        # Vem antes da gold do MKT: a saída dexp_gold_dynamics_nivel é entrada do fluxo MKT.
        - task_key: gold_dynamics_e_resenhas
          depends_on:
            - task_key: silver
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ../src/gold/dynamics_e_resenhas.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        # Ramo separado: se o Hispana falhar, o Brasil continua.
        - task_key: gold_hispana
          depends_on:
            - task_key: silver
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ../src/gold/hispana.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: gold_mkt
          depends_on:
            - task_key: gold_dynamics_e_resenhas
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ../src/gold/mkt.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
