# Bundle do projeto Daily Experiência BR (MKT + Dynamics e Resenhas).
# Jobs, pipelines e notebooks são declarados em resources/ e publicados com:
#   databricks bundle deploy -t dev
bundle:
  name: daily-experiencia

include:
  - resources/*.yml

# Só o que roda no Databricks vai para o workspace; coleta/ e tests/ rodam na máquina local.
sync:
  exclude:
    - coleta/**
    - tests/**

variables:
  catalog:
    description: Catálogo do Unity Catalog onde fica o projeto
    default: sandbox
  schema:
    description: Schema que guarda o volume de entrada e as tabelas do projeto
    default: sustentacao_bau_experiencias
  cluster_id:
    # O usuário não tem permissão para jobs serverless; os jobs rodam no cluster all-purpose do time.
    description: Cluster em que os jobs rodam
    lookup:
      cluster: sustentacao_bau_experiencias_sandbox_python

targets:
  # Ambiente de desenvolvimento/paralelo: roda ao lado do fluxo Tableau Prep atual, sem tocá-lo.
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-02543f96-daa5.cloud.databricks.com
