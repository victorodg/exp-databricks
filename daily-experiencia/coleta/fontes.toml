# Fontes no Tableau Cloud (publicar_tableau.py): extrações das views, publicadas todo dia pela rotina, sem atualização
# agendada no Tableau Cloud.
# A fonte de referência identifica o projeto, porque há vários projetos com o mesmo nome em pastas diferentes.
# O prefixo evita substituir qualquer fonte que já exista no projeto.
[tableau]
servidor = "https://prod-useast-a.online.tableau.com"
site = "onlinenaturaco"
token_nome = "dexp-publicacao"
projeto = "3. SANDBOX"
fonte_referencia = "test-hc_exp_brasil"
prefixo = "dexp - "

[tableau.databricks]
servidor = "dbc-02543f96-daa5.cloud.databricks.com"
caminho_http = "/sql/1.0/warehouses/dcb43c45e3a55fe4"

